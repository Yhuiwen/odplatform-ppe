schema_version: training-config-v1
status: CONFIGURATION_FROZEN_ALIAS
execution_enabled: false

template_for: EXP-001
canonical_config: configs/training/exp001_baseline.yaml
dataset: CSS-PPE-10-V1
model: YOLO11n
class_count: 7
epochs: 100
imgsz: 640
batch: 16
optimizer: AdamW
learning_rate: 0.001
lr_strategy: cosine
augmentation: experiments/configs/augmentation.yaml
seed: 42
device: "cuda:0"
workers: 8

metrics:
  - mAP50
  - mAP50-95
  - precision
  - recall
  - per-class AP
  - confusion matrix
  - inference speed
  - model size
