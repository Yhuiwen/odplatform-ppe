# Frozen tracking contract. Phase 5-1 uses the person-only Ultralytics
# ByteTrack adapter; P5-0 thresholds remain unchanged.
schema_version: tracking-runtime-freeze-v1
tracker:
  phase: 5
  subphase: 5-1
  status: frozen
  execution_enabled: true
  implementation:
    provider: ultralytics
    api: BYTETracker
    version: "8.4.157"
    dependency_source: locks/EVAL-001/requirements.txt
  parameters:
    track_high_thresh: 0.5
    track_low_thresh: 0.1
    new_track_thresh: 0.6
    track_buffer: 30
    match_thresh: 0.8
    fuse_score: true
  person_filter:
    class_id: 0
    class_name: person
    min_confidence: 0.25
  output:
    schema: core/schemas/tracking.py
    result_type: TrackResult
  errors:
    fail_closed: true
    auto_download: false
    silent_class_remap: false
