limitations:
- 82-image test split with recorded valid/test near-duplicate candidates and class
  imbalance.
- Both candidates belong to one training run; no independent-model superiority established.
- Selected no_hardhat recall is 0.609756 and small-object recall is 0.544444; misses
  remain material.
- Detector precision/recall do not establish person-PPE association, temporal violation
  detection or event false-alarm rates.
- Teacher Baseline not compared; deployment readiness and statistical significance
  not established.
