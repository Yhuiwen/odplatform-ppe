selection_rationale:
- Retain the validation-selected epoch-75 checkpoint; do not replace it by maximizing
  observed test mAP.
- Existing CMP-001 evidence shows higher no_hardhat recall (25/41 versus 24/41) and
  higher overall and five-PPE-class macro precision for best.pt.
- The alternative improves mAP, no_vest recall and small-object recall; these mixed
  results do not establish a uniformly better PPE detector.
- This is a documented engineering tradeoff for the integration baseline, not proof
  of safer operation or statistically significant superiority.
criteria_policy:
  basis: Preserve prior validation selection; review both violation-class recalls,
    precision, per-class AP, small-object recall and reproducibility.
  timing: Qualitative comparative review documented after CMP-001; not a preregistered
    scoring rule.
