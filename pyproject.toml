[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odplatform-ppe"
version = "0.1.0"
description = "YOLO11-based construction PPE compliance and alert platform"
readme = "README.md"
requires-python = ">=3.10"
# Package metadata is intentionally dependency-free. Install the complete
# final-demo runtime from locks/FINAL-DEMO-RUNTIME-001/requirements.txt;
# `pip install .` alone is not a complete application installation.
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "infra*", "services*", "utils*", "web*"]

[tool.setuptools.package-data]
"infra.database.migrations" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
